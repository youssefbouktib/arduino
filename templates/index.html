<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PlantGuard — Disease Detection</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green-dark:  #0d2b1a;
    --green-mid:   #1a4d2e;
    --green-main:  #2d7a4f;
    --green-light: #4caf78;
    --green-glow:  #6fcf97;
    --red-main:    #e05252;
    --red-glow:    #ff8080;
    --amber:       #f0a500;
    --bg:          #07150e;
    --surface:     #0f2318;
    --surface2:    #152d1f;
    --border:      #1e3d2a;
    --text:        #e8f5ee;
    --text-muted:  #7aab8a;
    --mono:        'Space Mono', monospace;
    --sans:        'Space Grotesk', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.3px;
  }
  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green-glow);
    box-shadow: 0 0 10px var(--green-glow);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .5; transform: scale(.85); }
  }
  .server-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-muted);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
  }
  .status-dot.online  { background: var(--green-glow); box-shadow: 0 0 6px var(--green-glow); }
  .status-dot.offline { background: var(--red-main); }

  /* ── Layout ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 24px;
    gap: 24px;
  }

  /* ── Camera panel ── */
  .camera-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .camera-frame {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #video, #preview-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .camera-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
  }
  .camera-placeholder svg { opacity: .4; }
  .camera-placeholder p { font-size: 14px; }

  /* scanning overlay */
  .scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
  }
  .scan-overlay.active { display: block; }
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green-glow), transparent);
    animation: scan 1.8s ease-in-out infinite;
    box-shadow: 0 0 8px var(--green-glow);
  }
  @keyframes scan {
    0%   { top: 0; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }
  .corner {
    position: absolute;
    width: 24px; height: 24px;
    border-color: var(--green-glow);
    border-style: solid;
    opacity: .7;
  }
  .corner.tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

  /* ── Buttons ── */
  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    padding: 13px 20px;
    border-radius: 10px;
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .btn-primary {
    background: var(--green-main);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--green-light);
    box-shadow: 0 0 20px rgba(77,175,120,.3);
  }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) {
    background: var(--surface);
    border-color: var(--green-main);
  }

  .btn-analyze {
    background: linear-gradient(135deg, var(--green-main), var(--green-mid));
    color: #fff;
    font-size: 15px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    width: 100%;
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 700;
    letter-spacing: .02em;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-analyze:hover:not(:disabled) {
    box-shadow: 0 0 30px rgba(45,122,79,.5);
    transform: translateY(-1px);
  }
  .btn-analyze:disabled { opacity: .4; cursor: not-allowed; }

  /* file input */
  #file-input { display: none; }

  /* ── Result panel ── */
  .result-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 12px;
    transition: border-color .3s;
  }
  .result-card.diseased {
    border-color: var(--red-main);
    box-shadow: 0 0 30px rgba(224,82,82,.1);
  }
  .result-card.healthy {
    border-color: var(--green-glow);
    box-shadow: 0 0 30px rgba(111,207,151,.1);
  }

  .result-status {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 700;
  }
  .result-status.diseased { background: rgba(224,82,82,.15); color: var(--red-glow); }
  .result-status.healthy  { background: rgba(111,207,151,.15); color: var(--green-glow); }
  .result-status.waiting  { background: rgba(122,171,138,.1); color: var(--text-muted); }

  .result-label {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text);
  }

  .result-confidence {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--green-glow);
  }
  .result-confidence.diseased { color: var(--red-glow); }

  .result-meta {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  /* confidence bar */
  .conf-bar-wrap {
    width: 100%;
    background: var(--surface2);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
  }
  .conf-bar {
    height: 100%;
    border-radius: 4px;
    background: var(--green-glow);
    transition: width .6s ease;
  }
  .conf-bar.diseased { background: var(--red-main); }

  /* ── History ── */
  .history-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    flex: 1;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .history-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .clear-btn {
    font-size: 11px;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--mono);
    padding: 3px 8px;
    border-radius: 4px;
    transition: color .15s;
  }
  .clear-btn:hover { color: var(--red-main); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
  }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    border: 1px solid var(--border);
    animation: slideIn .2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .history-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-dot.diseased { background: var(--red-main); }
  .history-dot.healthy  { background: var(--green-glow); }
  .history-info { flex: 1; min-width: 0; }
  .history-name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .history-time {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .history-conf {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .empty-history {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 24px 0;
  }

  /* ── Toast notification ── */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .toast {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    min-width: 280px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    animation: toastIn .3s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .toast.diseased { border-color: var(--red-main); }
  .toast.healthy  { border-color: var(--green-glow); }
  .toast-icon { font-size: 20px; }
  .toast-title { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .toast-body  { font-size: 12px; color: var(--text-muted); }

  /* ── Loading spinner ── */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Server URL input ── */
  .server-input-wrap {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .server-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    transition: border-color .15s;
  }
  .server-input:focus { border-color: var(--green-main); }

  .btn-connect {
    padding: 9px 16px;
    background: var(--green-mid);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    transition: background .15s;
  }
  .btn-connect:hover { background: var(--green-main); }

  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    PlantGuard
  </div>
  <div class="server-status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">connecting...</span>
  </div>
</header>

<main>
  <!-- ── Left: Camera ── -->
  <div class="camera-panel">
    <div>
      <p class="panel-label">Camera / Image</p>
      <div class="camera-frame" id="camera-frame">
        <video id="video" autoplay playsinline></video>
        <img id="preview-img" alt="Plant preview"/>
        <div class="camera-placeholder" id="placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <p>Start camera or upload a photo</p>
        </div>
        <div class="scan-overlay" id="scan-overlay">
          <div class="scan-line"></div>
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-camera">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Start Camera
      </button>
      <button class="btn btn-secondary" id="btn-upload">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Upload Photo
      </button>
      <button class="btn btn-secondary" id="btn-capture" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
        Capture
      </button>
    </div>
    <input type="file" id="file-input" accept="image/*"/>

    <button class="btn-analyze" id="btn-analyze" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Analyze Plant
    </button>

    <!-- Server config -->
    <div>
      <p class="panel-label">Flask server URL</p>
      <div class="server-input-wrap">
        <input class="server-input" id="server-url" type="text" value="" placeholder="http://localhost:5000"/>
        <button class="btn-connect" id="btn-connect">Check</button>
      </div>
    </div>
  </div>

  <!-- ── Right: Results ── -->
  <div class="result-panel">
    <div>
      <p class="panel-label">Detection result</p>
      <div class="result-card" id="result-card">
        <span class="result-status waiting">Waiting for image</span>
        <p style="color:var(--text-muted);font-size:13px">Point the camera at a plant leaf and press Analyze</p>
      </div>
    </div>

    <div class="history-card">
      <div class="history-header">
        <span class="history-title">Detection history</span>
        <button class="clear-btn" id="btn-clear">Clear</button>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-history">No detections yet</div>
      </div>
    </div>
  </div>
</main>

<div class="toast-container" id="toast-container"></div>
<canvas id="canvas" style="display:none"></canvas>

<script>
// ── State ──
let stream = null;
let capturedBlob = null;
let history = [];
let serverUrl = window.location.origin;

// ── Elements ──
const video       = document.getElementById('video');
const previewImg  = document.getElementById('preview-img');
const placeholder = document.getElementById('placeholder');
const scanOverlay = document.getElementById('scan-overlay');
const canvas      = document.getElementById('canvas');
const fileInput   = document.getElementById('file-input');
const btnCamera   = document.getElementById('btn-camera');
const btnUpload   = document.getElementById('btn-upload');
const btnCapture  = document.getElementById('btn-capture');
const btnAnalyze  = document.getElementById('btn-analyze');
const btnConnect  = document.getElementById('btn-connect');
const btnClear    = document.getElementById('btn-clear');
const serverInput = document.getElementById('server-url');
const statusDot   = document.getElementById('status-dot');
const statusText  = document.getElementById('status-text');
const resultCard  = document.getElementById('result-card');
const historyList = document.getElementById('history-list');

// Initialize server URL input
serverInput.value = serverUrl;

// ── Server health check ──
async function checkServer(url) {
  try {
    const r = await fetch(`${url}/health`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      statusDot.className = 'status-dot online';
      statusText.textContent = 'server online';
      return true;
    }
  } catch {}
  statusDot.className = 'status-dot offline';
  statusText.textContent = 'server offline';
  return false;
}

btnConnect.addEventListener('click', () => {
  serverUrl = serverInput.value.trim().replace(/\/$/, '');
  checkServer(serverUrl);
});

// Auto-check on load
checkServer(serverUrl);
setInterval(() => checkServer(serverUrl), 10000);

// ── Camera ──
btnCamera.addEventListener('click', async () => {
  if (stream) {
    stopCamera();
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    video.style.display = 'block';
    placeholder.style.display = 'none';
    previewImg.style.display = 'none';
    btnCamera.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Stop Camera`;
    btnCapture.disabled = false;
    capturedBlob = null;
    btnAnalyze.disabled = true;
  } catch (e) {
    showToast('error', 'Camera error', 'Could not access camera. Try uploading a photo instead.');
  }
});

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display = 'none';
  placeholder.style.display = 'flex';
  btnCamera.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Start Camera`;
  btnCapture.disabled = true;
}

btnCapture.addEventListener('click', () => {
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    capturedBlob = blob;
    previewImg.src = URL.createObjectURL(blob);
    previewImg.style.display = 'block';
    video.style.display = 'none';
    btnAnalyze.disabled = false;
    stopCamera();
  }, 'image/jpeg', 0.9);
});

// ── File upload ──
btnUpload.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  capturedBlob = file;
  previewImg.src = URL.createObjectURL(file);
  previewImg.style.display = 'block';
  placeholder.style.display = 'none';
  if (stream) stopCamera();
  btnAnalyze.disabled = false;
  fileInput.value = '';
});

// ── Analyze ──
btnAnalyze.addEventListener('click', async () => {
  if (!capturedBlob) return;

  // Show scanning animation
  scanOverlay.classList.add('active');
  btnAnalyze.disabled = true;
  btnAnalyze.innerHTML = `<div class="spinner"></div> Analyzing...`;

  const formData = new FormData();
  formData.append('image', capturedBlob, 'plant.jpg');

  try {
    const res  = await fetch(`${serverUrl}/predict`, { method: 'POST', body: formData });
    const data = await res.json();

    scanOverlay.classList.remove('active');
    btnAnalyze.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Analyze Plant`;
    btnAnalyze.disabled = false;

    if (data.error) throw new Error(data.error);

    showResult(data);
    addHistory(data);
    if (data.is_diseased) {
      showToast('diseased', '⚠️ Disease detected', `${cleanLabel(data.label)} — ${data.confidence}% confidence`);
      triggerNotification(data);
    } else {
      showToast('healthy', '✅ Plant is healthy', `${cleanLabel(data.label)} — ${data.confidence}%`);
    }
  } catch (e) {
    scanOverlay.classList.remove('active');
    btnAnalyze.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Analyze Plant`;
    btnAnalyze.disabled = false;
    showToast('error', 'Request failed', e.message || 'Check the server is running.');
  }
});

// ── Display result ──
function cleanLabel(label) {
  return label.replace(/___/g, ' — ').replace(/_/g, ' ');
}

function showResult(data) {
  const diseased = data.is_diseased;
  const conf     = data.confidence;
  resultCard.className = `result-card ${diseased ? 'diseased' : 'healthy'}`;
  resultCard.innerHTML = `
    <span class="result-status ${diseased ? 'diseased' : 'healthy'}">${data.status}</span>
    <div class="result-label">${cleanLabel(data.label)}</div>
    <div class="result-confidence ${diseased ? 'diseased' : ''}">${conf}%</div>
    <div class="conf-bar-wrap" style="width:100%">
      <div class="conf-bar ${diseased ? 'diseased' : ''}" style="width:${conf}%"></div>
    </div>
    <div class="result-meta">${new Date(data.timestamp).toLocaleTimeString()}</div>
  `;
}

// ── History ──
function addHistory(data) {
  history.unshift(data);
  if (history.length > 20) history.pop();
  renderHistory();
}

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<div class="empty-history">No detections yet</div>';
    return;
  }
  historyList.innerHTML = history.map(d => `
    <div class="history-item">
      <div class="history-dot ${d.is_diseased ? 'diseased' : 'healthy'}"></div>
      <div class="history-info">
        <div class="history-name">${cleanLabel(d.label)}</div>
        <div class="history-time">${new Date(d.timestamp).toLocaleTimeString()}</div>
      </div>
      <div class="history-conf">${d.confidence}%</div>
    </div>
  `).join('');
}

btnClear.addEventListener('click', () => {
  history = [];
  renderHistory();
});

// ── Toast ──
function showToast(type, title, body) {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <div class="toast-icon">${type === 'diseased' ? '🌿' : type === 'healthy' ? '✅' : '❌'}</div>
    <div>
      <div class="toast-title">${title}</div>
      <div class="toast-body">${body}</div>
    </div>
  `;
  document.getElementById('toast-container').appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}

// ── Browser push notification ──
function triggerNotification(data) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('⚠️ Plant disease detected!', {
      body: `${cleanLabel(data.label)} — ${data.confidence}% confidence`,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌿</text></svg>'
    });
  }
}

// Request notification permission on load
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}
</script>
